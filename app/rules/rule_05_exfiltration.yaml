id: RULE-EXFIL-005
title: Data Exfiltration / Insider Threat
status: production
severity: KRITIS
description: >
  Mendeteksi potensi kebocoran data massal atau ancaman orang dalam: 1 user_id mengunduh database
  lebih dari 50 kali dalam rentang waktu 1 menit (60 detik).
mitre:
  tactic: Exfiltration
  technique_id: T1048
  technique_name: Exfiltration Over Alternative Protocol
detection:
  event_type: database_download
  status: any
  correlation:
    type: threshold_aggregation
    group_by: user_id
    window_seconds: 60
    min_count: 50
cooldown_seconds: 10
enabled: true
