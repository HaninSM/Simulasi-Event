<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="id-ID" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <!-- Canvas Background -->
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>
  <!-- Top Accent Bar -->
  <rect id="top-bar" x="0" y="0" width="1280" height="6" fill="#1E3A8A" data-pptx-role="decoration"/>

  <!-- Slide Header -->
  <g id="header-group" data-pptx-bounds="72 32 1136 80">
    <rect id="tag-bg" x="72" y="32" width="340" height="26" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="82" y="49" font-size="11" font-weight="bold" fill="#1E3A8A">09 / INCIDENT RESPONSE PLAYBOOKS (PRD §3D)</text>
    <text x="72" y="86" font-size="24" font-weight="bold" fill="#0F172A">SOAR Active Defense: Network Quarantine &amp; Identity Containment</text>
    <text x="72" y="108" font-size="14" fill="#64748B">Respons insiden aktif memutus rantai serangan langsung di level Gatekeeper secara real-time.</text>
  </g>
    <g id="soar-row-1" data-pptx-bounds="72 135 1136 115">
      <rect x="72" y="135" width="1136" height="115" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="135" width="8" height="115" rx="4" fill="#DC2626"/>
      <text x="96" y="167" font-size="16" font-weight="bold" fill="#0F172A">1. Network Quarantine (Isolate Host)</text>
      <rect x="520" y="151" width="220" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="532" y="167" font-size="11" font-family="Consolas, monospace" font-weight="bold" fill="#DC2626">POST /api/soar/isolate</text>
      <text x="96" y="201" font-size="13" fill="#475569">Analis mengisolasi IP penyerang dari dashboard. Status alert menjadi [CONTAINED] dan</text><text x="96" y="221" font-size="13" fill="#475569">buffer korelasi dibersihkan. Seluruh log lanjutan dari IP tersebut ditolak otomatis</text><text x="96" y="241" font-size="13" fill="#475569">di Gatekeeper (HTTP 403 HOST_ISOLATED).</text>
    </g>
    <g id="soar-row-2" data-pptx-bounds="72 265 1136 115">
      <rect x="72" y="265" width="1136" height="115" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="265" width="8" height="115" rx="4" fill="#7C3AED"/>
      <text x="96" y="297" font-size="16" font-weight="bold" fill="#0F172A">2. Identity Containment (Suspend User)</text>
      <rect x="520" y="281" width="220" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="532" y="297" font-size="11" font-family="Consolas, monospace" font-weight="bold" fill="#7C3AED">POST /api/soar/suspend-user</text>
      <text x="96" y="331" font-size="13" fill="#475569">Untuk insiden kredensial terkompromi (Impossible Travel), akun user dibekukan</text><text x="96" y="351" font-size="13" fill="#475569">seketika. Setiap percobaan autentikasi lanjutan ditolak di gerbang Gatekeeper (HTTP</text><text x="96" y="371" font-size="13" fill="#475569">403 USER_SUSPENDED).</text>
    </g>
    <g id="soar-row-3" data-pptx-bounds="72 395 1136 115">
      <rect x="72" y="395" width="1136" height="115" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="395" width="8" height="115" rx="4" fill="#059669"/>
      <text x="96" y="427" font-size="16" font-weight="bold" fill="#0F172A">3. Access Restoration (Release Playbook)</text>
      <rect x="520" y="411" width="220" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="532" y="427" font-size="11" font-family="Consolas, monospace" font-weight="bold" fill="#059669">POST /api/soar/release</text>
      <text x="96" y="461" font-size="13" fill="#475569">Setelah ancaman dinetralisir, analis dapat melepas karantina host atau mengaktifkan</text><text x="96" y="481" font-size="13" fill="#475569">kembali akun pengguna dengan satu klik tanpa perlu merestart server SIEM.</text>
    </g>
    <g id="soar-row-4" data-pptx-bounds="72 525 1136 115">
      <rect x="72" y="525" width="1136" height="115" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="525" width="8" height="115" rx="4" fill="#0284C7"/>
      <text x="96" y="557" font-size="16" font-weight="bold" fill="#0F172A">4. Immutable Audit Trail</text>
      <rect x="520" y="541" width="220" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="532" y="557" font-size="11" font-family="Consolas, monospace" font-weight="bold" fill="#0284C7">GET /api/soar/audit</text>
      <text x="96" y="591" font-size="13" fill="#475569">Setiap aksi karantina, pembekuan user, dan pemulihan dicatat kronologis dalam jejak</text><text x="96" y="611" font-size="13" fill="#475569">audit SOAR (mencakup action, target, alasan, dan stempel waktu ISO UTC) untuk</text><text x="96" y="631" font-size="13" fill="#475569">akuntabilitas.</text>
    </g>
  <!-- Footer -->
  <g id="footer-group" data-pptx-bounds="72 685 1136 30">
    <line x1="72" y1="685" x2="1208" y2="685" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="704" font-size="12" fill="#64748B">Mini-SIEM Command Center | Tim 'JadiBegini' | Enterprise Cybersecurity Architecture</text>
  </g>
</svg>