      <rect x="852" y="135" width="6" height="520" rx="3" fill="#7C3AED"/>
      <text x="872" y="165" font-size="14" font-weight="bold" fill="#7C3AED">SKENARIO 6: CARELESS WHITELISTING</text>
      <text x="872" y="210" font-size="12" font-weight="600" fill="#64748B">Demonstrasi Fatal Error &amp; Blind Spot</text>
      <line x1="872" y1="230" x2="1197" y2="230" stroke="#E2E8F0" stroke-width="1"/>
      <text x="872" y="260" font-size="12" fill="#334155">• Konsep: Admin memasukkan IP jahat ke Whitelist.</text><text x="872" y="302" font-size="12" fill="#334155">• Dampak: Mesin korelasi MENGABAIKAN log IP tsb.</text><text x="872" y="344" font-size="12" fill="#334155">• Edukasi: Membuktikan risiko fatal bypass whitelist.</text><text x="872" y="386" font-size="12" fill="#334155">• Pemulihan: Hapus IP dari whitelist memulihkan alarm.</text>
    </g>
