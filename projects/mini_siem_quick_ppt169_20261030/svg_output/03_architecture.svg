<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="id-ID" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <!-- Canvas Background -->
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>
  <!-- Top Accent Bar -->
  <rect id="top-bar" x="0" y="0" width="1280" height="6" fill="#1E3A8A" data-pptx-role="decoration"/>

  <!-- Slide Header -->
  <g id="header-group" data-pptx-bounds="72 32 1136 80">
    <rect id="tag-bg" x="72" y="32" width="340" height="26" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="82" y="49" font-size="11" font-weight="bold" fill="#1E3A8A">02 / ARSITEKTUR SISTEM (PRD §3 &amp; §5)</text>
    <text x="72" y="86" font-size="24" font-weight="bold" fill="#0F172A">Arsitektur 5-Layer Pipeline End-to-End</text>
    <text x="72" y="108" font-size="14" fill="#64748B">Alur telemetri heterogen dari sensor fisik, normalisasi data, korelasi stateful, hingga respons aktif.</text>
  </g>
    <g id="layer-1" data-pptx-bounds="72 135 1136 92">
      <rect x="72" y="135" width="1136" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="135" width="8" height="92" rx="4" fill="#2563EB"/>
      <text x="96" y="165" font-size="15" font-weight="bold" fill="#0F172A">Layer 1: Telemetri Heterogen</text>
      <text x="96" y="191" font-size="13" fill="#475569">Web Servers (Nginx), SSH Auth (Syslog RFC 3164), Access Gate (CSV), DB Audit (PGAudit JSONL), &amp; Hardware OT (MQTT Broker). 27 berkas log autentik di sample_logs/.</text>
    </g>
    <g id="layer-2" data-pptx-bounds="72 240 1136 92">
      <rect x="72" y="240" width="1136" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="240" width="8" height="92" rx="4" fill="#7C3AED"/>
      <text x="96" y="270" font-size="15" font-weight="bold" fill="#0F172A">Layer 2: Universal Log Adapter</text>
      <text x="96" y="296" font-size="13" fill="#475569">app/log_adapter.py: Regex parser multi-format mengonversi log mentah ke kontrak kanonikal LogEvent secara dinamis relatif terhadap waktu nyata NOW().</text>
    </g>
    <g id="layer-3" data-pptx-bounds="72 345 1136 92">
      <rect x="72" y="345" width="1136" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="345" width="8" height="92" rx="4" fill="#DC2626"/>
      <text x="96" y="375" font-size="15" font-weight="bold" fill="#0F172A">Layer 3: Gatekeeper &amp; Schema Validation</text>
      <text x="96" y="401" font-size="13" fill="#475569">app/main.py: Pydantic V2 schema validation, IPv4 format check, Time Drift verification (&lt;24h). SOAR check: isolated host &amp; suspended user -&gt; HTTP 403 Forbidden.</text>
    </g>
    <g id="layer-4" data-pptx-bounds="72 450 1136 92">
      <rect x="72" y="450" width="1136" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="450" width="8" height="92" rx="4" fill="#0284C7"/>
      <text x="96" y="480" font-size="15" font-weight="bold" fill="#0F172A">Layer 4: Correlation Engine (The Brain)</text>
      <text x="96" y="506" font-size="13" fill="#475569">app/engine.py: Stateful in-memory sliding windows (10s, 60s, 1h), debouncing alert cooldown, Stateful Watchlist APT, dan korelasi sabotase OT.</text>
    </g>
    <g id="layer-5" data-pptx-bounds="72 555 1136 92">
      <rect x="72" y="555" width="1136" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="555" width="8" height="92" rx="4" fill="#059669"/>
      <text x="96" y="585" font-size="15" font-weight="bold" fill="#0F172A">Layer 5: Storage &amp; SOC Active Console</text>
      <text x="96" y="611" font-size="13" fill="#475569">Hot In-Memory Cache (5000 logs, 1000 alerts) + Cold Storage Archive. Dashboard web cyberpunk real-time (polling 2 detik) + SOAR Active Defense Panel.</text>
    </g>
