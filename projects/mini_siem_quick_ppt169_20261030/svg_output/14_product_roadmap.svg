      <rect x="72" y="135" width="365" height="38" rx="8" fill="#0284C7" fill-opacity="0.08"/>
      <rect x="72" y="135" width="6" height="240" rx="3" fill="#0284C7"/>
      <text x="92" y="160" font-size="13" font-weight="bold" fill="#0284C7">MVP v1: Foundation (Fitur 1 - 6)</text>
      <text x="92" y="205" font-size="11" fill="#334155">• 1. Log Ingestion Engine (Critical)</text><text x="92" y="231" font-size="11" fill="#334155">• 2. Data Parsing &amp; Normalization (Critical)</text><text x="92" y="257" font-size="11" fill="#334155">• 3. Hot Storage &amp; Indexing (Critical)</text><text x="92" y="283" font-size="11" fill="#334155">• 4. Search &amp; Query Interface (High)</text><text x="92" y="309" font-size="11" fill="#334155">• 5. Rule-Based Alerting (High)</text><text x="92" y="335" font-size="11" fill="#334155">• 6. Basic Dashboard &amp; Reporting (Medium)</text>
