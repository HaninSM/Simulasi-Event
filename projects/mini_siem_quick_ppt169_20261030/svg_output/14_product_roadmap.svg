      <text x="872" y="160" font-size="13" font-weight="bold" fill="#059669">Phase 3: Advanced (Fitur 11 - 13)</text>
      <text x="872" y="205" font-size="11" fill="#334155">• 11. UEBA (Behavioral ML Model)</text><text x="872" y="231" font-size="11" fill="#334155">• 12. SOAR (Automated Playbooks)</text><text x="872" y="257" font-size="11" fill="#334155">• 13. AI Adaptive Rule Generator</text><text x="872" y="283" font-size="11" fill="#334155">•     (DLQ, Canary Replay, &amp; HITL Approval)</text>
