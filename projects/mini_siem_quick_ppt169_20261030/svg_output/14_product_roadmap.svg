      <rect x="462" y="135" width="6" height="240" rx="3" fill="#7C3AED"/>
      <text x="482" y="160" font-size="13" font-weight="bold" fill="#7C3AED">Phase 2: Intelligence (Fitur 7 - 10)</text>
      <text x="482" y="205" font-size="11" fill="#334155">• 7. Correlation Engine (High - Stateful)</text><text x="482" y="231" font-size="11" fill="#334155">• 8. Threat Intel Integration (High - IoC)</text><text x="482" y="257" font-size="11" fill="#334155">• 9. Incident &amp; Case Management (Medium)</text><text x="482" y="283" font-size="11" fill="#334155">• 10. Cold Storage / Archiving (Retensi 1-7 Thn)</text>
