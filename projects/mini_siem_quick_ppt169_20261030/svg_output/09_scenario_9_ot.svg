      <text x="92" y="165" font-size="14" font-weight="bold" fill="#0284C7">1. KONTEKS HARDWARE OT</text>
      <text x="92" y="230" font-size="12" fill="#334155">• Target Fisik: Pendingin utama</text><text x="92" y="250" font-size="12" fill="#334155">  datacenter (CRAC-AC-01 / Chiller).</text><text x="92" y="282" font-size="12" fill="#334155">• Protokol: MQTT terhubung ke sistem</text><text x="92" y="302" font-size="12" fill="#334155">  sensor SCADA/BMS.</text><text x="92" y="334" font-size="12" fill="#334155">• Dampak: AC mati mendadak</text><text x="92" y="354" font-size="12" fill="#334155">  menyebabkan kenaikan suhu rak server</text><text x="92" y="374" font-size="12" fill="#334155">  dan thermal runaway fatal.</text>
