    <text x="82" y="49" font-size="11" font-weight="bold" fill="#1E3A8A">08 / SKENARIO INSIDEN (PRD §4)</text>
    <text x="72" y="86" font-size="24" font-weight="bold" fill="#0F172A">Skenario 9: Sabotase Fisik Datacenter - AC Central Shutdown (MQTT)</text>
    <text x="72" y="108" font-size="14" fill="#64748B">Mendeteksi sabotase fasilitas pendingin datacenter melalui protokol MQTT dan respon karantina SOAR.</text>
