      <text x="872" y="165" font-size="14" font-weight="bold" fill="#DC2626">3. DETEKSI &amp;amp; RESPON SOAR</text>
      <text x="872" y="230" font-size="12" fill="#334155">• Deteksi: SIEM mengenali protokol</text><text x="872" y="250" font-size="12" fill="#334155">  MQTT &amp; hardware pendingin, memicu</text><text x="872" y="270" font-size="12" fill="#334155">  alarm KRITIS.</text><text x="872" y="302" font-size="12" fill="#334155">• Pertahanan Aktif: Analis</text><text x="872" y="322" font-size="12" fill="#334155">  mengisolasi IP penyerang via SOAR.</text><text x="872" y="354" font-size="12" fill="#334155">• Perintah sabotase lanjutan langsung</text><text x="872" y="374" font-size="12" fill="#334155">  di-drop di Gatekeeper (HTTP 403)!</text>
