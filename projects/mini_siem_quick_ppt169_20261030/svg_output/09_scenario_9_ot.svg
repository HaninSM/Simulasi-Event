      <text x="482" y="165" font-size="14" font-weight="bold" fill="#D97706">2. ALUR REPLAY 2 TAHAP</text>
      <text x="482" y="230" font-size="12" fill="#334155">• Tahap 1: Sensor membaca telemetri</text><text x="482" y="250" font-size="12" fill="#334155">  suhu wajar (18.5°C) &amp; perintah</text><text x="482" y="270" font-size="12" fill="#334155">  STATUS_REPORT -&gt; Lolos normal.</text><text x="482" y="302" font-size="12" fill="#334155">• Tahap 2: Oknum ilegal mengirim</text><text x="482" y="322" font-size="12" fill="#334155">  perintah sabotase POWER_OFF via</text><text x="482" y="342" font-size="12" fill="#334155">  topik MQTT crac01/power.</text>
    </g>
