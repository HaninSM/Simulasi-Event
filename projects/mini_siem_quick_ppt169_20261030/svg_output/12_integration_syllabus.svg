<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="id-ID" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <!-- Canvas Background -->
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>
  <!-- Top Accent Bar -->
  <rect id="top-bar" x="0" y="0" width="1280" height="6" fill="#1E3A8A" data-pptx-role="decoration"/>

  <!-- Slide Header -->
  <g id="header-group" data-pptx-bounds="72 32 1136 80">
    <rect id="tag-bg" x="72" y="32" width="340" height="26" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="82" y="49" font-size="11" font-weight="bold" fill="#1E3A8A">11 / PRASYARAT INTEGRASI (PRD §7)</text>
    <text x="72" y="86" font-size="24" font-weight="bold" fill="#0F172A">Prasyarat Integrasi Infrastruktur: Universal Ingestion Syllabus</text>
    <text x="72" y="108" font-size="14" fill="#64748B">Empat tahapan persiapan fondasi data, standarisasi protokol, sinkronisasi NTP, dan konteks bisnis.</text>
  </g>
    <g id="syl-card-1" data-pptx-bounds="72 135 556 240">
      <rect x="72" y="135" width="556" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="135" width="8" height="240" rx="4" fill="#0284C7"/>
      <text x="92" y="171" font-size="15" font-weight="bold" fill="#0F172A">Tahap 1: Fondasi Bahan Baku Log</text>
      <line x1="92" y1="185" x2="608" y2="185" stroke="#E2E8F0" stroke-width="1"/>
      <text x="92" y="210" font-size="12" fill="#334155">• Anatomi Log: Membedakan Event, Payload, dan Metadata.</text><text x="92" y="255" font-size="12" fill="#334155">• Log Lifecycle: Titik lahir -&gt; Forwarding -&gt; Hot Storage -&gt; Cold Archive.</text><text x="92" y="300" font-size="12" fill="#334155">• Kalkulasi EPS: Menghitung beban volume agar buffer korelasi tidak overflow.</text>
    </g>
    <g id="syl-card-2" data-pptx-bounds="652 135 556 240">
      <rect x="652" y="135" width="556" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="652" y="135" width="8" height="240" rx="4" fill="#2563EB"/>
      <text x="672" y="171" font-size="15" font-weight="bold" fill="#0F172A">Tahap 2: Standarisasi Bahasa</text>
      <line x1="672" y1="185" x2="1188" y2="185" stroke="#E2E8F0" stroke-width="1"/>
      <text x="672" y="210" font-size="12" fill="#334155">• RFC 5424 Syslog: Format pembungkus standar (Timestamp, Host, Severity).</text><text x="672" y="255" font-size="12" fill="#334155">• Kepatuhan NIST SP 800-92: Wajib catat login gagal &amp; eskalasi privilese.</text><text x="672" y="300" font-size="12" fill="#334155">• OCSF / CIM Schema: Menyatukan field multi-vendor ke satu taksonomi.</text>
    </g>
    <g id="syl-card-3" data-pptx-bounds="72 395 556 240">
      <rect x="72" y="395" width="556" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="72" y="395" width="8" height="240" rx="4" fill="#D97706"/>
      <text x="92" y="431" font-size="15" font-weight="bold" fill="#0F172A">Tahap 3: Prasyarat Jaringan</text>
      <line x1="92" y1="445" x2="608" y2="445" stroke="#E2E8F0" stroke-width="1"/>
      <text x="92" y="470" font-size="12" fill="#334155">• Sinkronisasi Waktu Sentral (NTP): Seluruh server merujuk waktu atomik UTC.</text><text x="92" y="515" font-size="12" fill="#334155">• Log Forwarder: Menggunakan Fluentd / Logstash terdistribusi di tiap host.</text><text x="92" y="560" font-size="12" fill="#334155">• Noise Filtering: Membuang ping rutin internal di level forwarder.</text>
    </g>
    <g id="syl-card-4" data-pptx-bounds="652 395 556 240">
      <rect x="652" y="395" width="556" height="240" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <rect x="652" y="395" width="8" height="240" rx="4" fill="#059669"/>
      <text x="672" y="431" font-size="15" font-weight="bold" fill="#0F172A">Tahap 4: Konteks Bisnis</text>
      <line x1="672" y1="445" x2="1188" y2="445" stroke="#E2E8F0" stroke-width="1"/>
      <text x="672" y="470" font-size="12" fill="#334155">• Asset Management: Klasifikasi kekritisan server inti vs WiFi publik.</text><text x="672" y="515" font-size="12" fill="#334155">• Definisi Use Case: Merumuskan skenario deteksi ancaman sebelum live.</text><text x="672" y="560" font-size="12" fill="#334155">• SOP &amp; Eskalasi: Penetapan PIC tim penanggung jawab saat alarm berbunyi.</text>
    </g>
